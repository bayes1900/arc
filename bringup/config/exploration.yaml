      boxMinY: -15.0
      boxMinZ: 0.0
      boxMaxX: 7.0
      boxMaxY: 15.0
      boxMaxZ: 1.7
    sensor:
      fx: 387.229
      fy: 387.229
      cx: 321.046
      cy: 243.449
      minDepth: 0.2
      maxDepth: 4.6
      margin: 2
      scalingFactor: 1000.0
      skipPixel: 2
    frontier:
      clusterMin: 100
      clusterSizeXY: 2.0
      minCandidateDist: 0.5
